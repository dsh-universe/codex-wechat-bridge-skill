<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8e8e8;width:720px;height:560px;display:flex;align-items:center;justify-content:center;}
.phone{width:330px;background:#ededed;border-radius:32px;border:7px solid #222;overflow:hidden;box-shadow:0 18px 38px rgba(0,0,0,.28);}
.status{height:28px;background:#2e9a4c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.nav{height:44px;background:#2e9a4c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;}
.chat-body{height:470px;background:#ededed;padding:14px 12px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.45;}
.day{align-self:center;font-size:12px;color:#999;}
.bubble{max-width:78%;padding:10px 12px;border-radius:6px;position:relative;}
.bubble.user{align-self:flex-end;background:#95ec69;}
.bubble.bot{align-self:flex-start;background:#fff;}
.bubble.bot::before,.bubble.user::before{content:'';position:absolute;top:0;width:0;height:0;border:6px solid transparent;}
.bubble.bot::before{left:-6px;border-right-color:#fff;border-left:0;}
.bubble.user::before{right:-6px;border-left-color:#95ec69;border-right:0;}
.typing{align-self:flex-start;color:#999;font-size:12px;margin-top:-4px;}
.input{margin-top:auto;background:#f7f7f7;border-top:1px solid #ddd;height:42px;display:flex;align-items:center;padding:0 12px;color:#aaa;font-size:14px;}
</style></head><body>
<div class="phone">
  <div class="status">微信</div>
  <div class="nav">Codex 机器人</div>
  <div class="chat-body">
    <div class="day">今天 19:00</div>
    <div class="bubble bot">你好，我是 Codex，你的微信助手 😊</div>
    <div class="bubble user">今天龙虎榜有什么票上榜？</div>
    <div class="typing">对方正在输入…</div>
    <div class="bubble bot">收到！我查一下当日龙虎榜数据。</div>
    <div class="input">⌨ 发送</div>
  </div>
</div>
</body></html>
