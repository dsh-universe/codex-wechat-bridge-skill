<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:ui-monospace,Consolas,"Microsoft YaHei",monospace;width:360px;height:590px;background:#1e1e1e;color:#9fe8c0;overflow:hidden;}
.status{height:26px;background:#2e9a4c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:-apple-system,"PingFang SC";font-size:12px;font-weight:600;}
.nav{height:44px;background:#2e9a4c;color:#fff;display:flex;align-items:center;justify-content:center;font-family:-apple-system,"PingFang SC";font-size:17px;font-weight:600;}
.term{height:520px;padding:22px;font-size:15px;line-height:1.8;}
.p{margin-bottom:10px;}.arrow{color:#e0e0e0;}.ok{color:#7fd4a8;}
</style></head><body>
<div class="status"><span>19:34</span><span>▮▮▮ ●</span></div>
<div class="nav">Terminal</div>
<div class="term">
  <div class="p"><span class="arrow">$</span> python wechat_bridge.py login</div>
  <div class="ok">✓ 微信连接成功，账号已保存</div>
  <div class="p"><span class="arrow">$</span> python wechat_bridge.py run</div>
  <div class="ok">wechat bridge running...</div>
  <div class="p"><span class="arrow">[recv]</span> 你好</div>
  <div class="ok">[sent] 回复成功</div>
</div>
</body></html>
