<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #e8e8e8;
      width: 1280px; height: 840px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    .title { font-size: 26px; font-weight: 700; color: #1a1a1a; }
    .sub { color: #7a7a7a; font-size: 15px; }
    .row { display: flex; gap: 40px; align-items: flex-start; }
    .phone {
      width: 360px; background: #ededed; border-radius: 34px;
      border: 8px solid #222; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,.25);
    }
    .status { height: 30px; background: #2e9a4c; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .nav {
      height: 46px; background: #2e9a4c; color: #fff; display: flex;
      align-items: center; justify-content: center; font-size: 16px; font-weight: 600;
    }
    .scan-body { height: 520px; background: linear-gradient(180deg,#1e1e1e,#2a2a2a); display: flex; flex-direction: column; align-items: center; padding: 40px 20px; color: #fff; }
    .scan-frame { width: 210px; height: 210px; margin: 24px 0 20px; background: #fff; border-radius: 12px; display: grid; place-items: center; color: #111; font-size: 40px; font-weight: 800; position: relative; }
    .scan-frame::before { content:''; position:absolute; inset:0; border: 4px solid #07C160; border-radius: 12px; }
    .scan-tip { font-size: 15px; color: #cfcfcf; }
    .scan-confirm { margin-top: 22px; background: #07C160; color: #fff; padding: 11px 26px; border-radius: 26px; font-size: 15px; font-weight: 600; }
    .chat-body { height: 566px; background: #ededed; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.45; }
    .day { align-self: center; font-size: 12px; color: #999; }
    .bubble { max-width: 76%; padding: 10px 12px; border-radius: 6px; position: relative; }
    .bubble.user { align-self: flex-end; background: #95ec69; }
    .bubble.bot { align-self: flex-start; background: #fff; }
    .bubble.bot::before, .bubble.user::before { content:''; position:absolute; top:0; width:0; height:0; border:6px solid transparent; }
    .bubble.bot::before { left:-6px; border-right-color:#fff; border-left:0; }
    .bubble.user::before { right:-6px; border-left-color:#95ec69; border-right:0; }
    .typing { align-self: flex-start; color: #999; font-size: 12px; margin-top: -4px; }
    .input { margin-top: auto; background:#f7f7f7; border-top:1px solid #ddd; height:44px; display:flex; align-items:center; padding:0 12px; color:#aaa; font-size:14px; }
    .note { text-align: center; color: #9a9a9a; font-size: 13px; }
  </style>
</head>
<body>
  <div class="title">Codex → 微信机器人</div>
  <div class="sub">把 Codex 接到你的个人微信，用起来就像跟一个微信好友聊天</div>
  <div class="row">
    <div class="phone">
      <div class="status">微信</div>
      <div class="nav">扫一扫</div>
      <div class="scan-body">
        <div class="scan-frame">QR</div>
        <div class="scan-tip">扫描二维码登录</div>
        <div class="scan-confirm">确认登录</div>
      </div>
    </div>
    <div class="phone">
      <div class="status">微信</div>
      <div class="nav">Codex 机器人</div>
      <div class="chat-body">
        <div class="day">今天 19:00</div>
        <div class="bubble bot">你好，我是 Codex，你的微信助手 😊</div>
        <div class="bubble user">今天龙虎榜有什么票上榜？</div>
        <div class="typing">对方正在输入…</div>
        <div class="bubble bot">收到！我查一下当日龙虎榜数据，稍等。</div>
        <div class="input">⌨ 发送</div>
      </div>
    </div>
  </div>
  <div class="note">示意图 · 用于说明使用流程，非真实聊天记录</div>
</body>
</html>
