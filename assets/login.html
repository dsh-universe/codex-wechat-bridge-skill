<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8e8e8;width:720px;height:560px;display:flex;align-items:center;justify-content:center;}
.phone{width:330px;background:#ededed;border-radius:32px;border:7px solid #222;overflow:hidden;box-shadow:0 18px 38px rgba(0,0,0,.28);}
.status{height:28px;background:#2e9a4c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.nav{height:44px;background:#2e9a4c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;}
.scan-body{height:470px;background:linear-gradient(180deg,#1e1e1e,#2a2a2a);display:flex;flex-direction:column;align-items:center;padding:36px 20px;color:#fff;}
.scan-frame{width:200px;height:200px;margin:22px 0 18px;background:#fff;border-radius:12px;display:grid;place-items:center;color:#111;font-size:40px;font-weight:800;position:relative;}
.scan-frame::before{content:'';position:absolute;inset:0;border:4px solid #07C160;border-radius:12px;}
.scan-tip{font-size:15px;color:#cfcfcf;}
.scan-confirm{margin-top:20px;background:#07C160;color:#fff;padding:11px 26px;border-radius:26px;font-size:15px;font-weight:600;}
</style></head><body>
<div class="phone">
  <div class="status">微信</div>
  <div class="nav">扫一扫</div>
  <div class="scan-body">
    <div class="scan-frame">QR</div>
    <div class="scan-tip">扫描二维码登录</div>
    <div class="scan-confirm">确认登录</div>
  </div>
</div>
</body></html>
