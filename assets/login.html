<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;width:360px;height:590px;background:#1e1e1e;color:#fff;overflow:hidden;}
.status{height:26px;background:#2e9a4c;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;font-weight:600;}
.nav{height:44px;background:#2e9a4c;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;}
.scan{height:520px;background:linear-gradient(180deg,#1e1e1e,#2a2a2a);display:flex;flex-direction:column;align-items:center;padding:40px 24px;}
.frame{width:200px;height:200px;background:#fff;border-radius:14px;display:grid;place-items:center;color:#111;font-size:42px;font-weight:800;position:relative;margin:26px 0 20px;}
.frame::before{content:'';position:absolute;inset:0;border:4px solid #07C160;border-radius:14px;}
.tip{font-size:15px;color:#cfcfcf;}
.confirm{margin-top:24px;background:#07C160;color:#fff;padding:12px 30px;border-radius:28px;font-size:16px;font-weight:600;}
</style></head><body>
<div class="status"><span>19:34</span><span>▮▮▮ ●</span></div>
<div class="nav">扫一扫</div>
<div class="scan"><div class="frame">QR</div><div class="tip">扫描二维码登录</div><div class="confirm">确认登录</div></div>
</body></html>
